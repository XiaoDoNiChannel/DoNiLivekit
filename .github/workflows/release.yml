name: Release Windows

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install root Tauri CLI dependencies
        run: npm ci

      - name: Verify updater signing key matches client public key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: .\scripts\Test-UpdaterSigningKey.ps1

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Verify tag and application versions
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $uiVersion = (Get-Content ui/package.json -Raw | ConvertFrom-Json).version
          $rootVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $tauriVersion -or $tagVersion -ne $cargoVersion -or $tagVersion -ne $uiVersion -or $tagVersion -ne $rootVersion) {
            throw "Version mismatch: tag=$tagVersion tauri=$tauriVersion cargo=$cargoVersion ui=$uiVersion root=$rootVersion"
          }

      - name: Build and sign portable EXE
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: .\scripts\Build-PortableRelease.ps1

      - name: Smoke test portable updater helper
        shell: pwsh
        run: .\tests\portable_update_smoke.ps1

      - name: Upload portable assets to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            "release-assets/$tag/DoNiChannel.exe",
            "release-assets/$tag/DoNiChannel.exe.sig",
            "release-assets/$tag/latest-portable.json"
          )
          $existing = & gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) {
              throw "Refusing to overwrite a published release. Use a new version."
            }
            & gh release upload $tag @assets --clobber
          } else {
            & gh release create $tag @assets --verify-tag --draft --title "DoNiChannel $tag" --notes-file RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release upload failed" }
